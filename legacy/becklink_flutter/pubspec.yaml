name: becklink_flutter
description: >-
  Renamed to becklinks_flutter. This package only re-exports becklinks_flutter so that apps
  that still import it keep working. Use becklinks_flutter directly.
version: 0.2.1
homepage: https://becklinks.com
repository: https://github.com/Tecbeckp/becklinks-flutter
issue_tracker: https://github.com/Tecbeckp/becklinks-flutter/issues
documentation: https://docs.becklinks.com/flutter-sdk

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  becklinks_flutter: ^0.3.0
